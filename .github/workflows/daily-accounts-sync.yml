name: Daily Accounts Sync

# Dispara la sincronización diaria del módulo Cuentas (POST /api/accounts/sync-daily):
# acredita EFECTIVO/NEQUI/DAVIPLATA/QR/ADDI+DATÁFONO con TODOS los cierres de
# caja pendientes de sincronizar hasta hoy (no solo el de hoy - si algún día
# quedó sin sincronizar, ej. un cierre atrasado, también se acredita aquí) y
# lo compara contra el total reportado por Alegra.
#
# 9:00pm hora Colombia (America/Bogota, UTC-5) == 02:00 UTC del día siguiente.
# Requiere el secret DAILY_SYNC_TOKEN (Settings > Secrets and variables > Actions),
# con el mismo valor que la variable de entorno DAILY_SYNC_TOKEN en Render.
#
# Multi-tienda: un job por tienda (header X-Store), independientes entre sí
# (fail-fast: false) - si una tienda falla, la otra igual se sincroniza y la
# alerta de fallo queda registrada SOLO en la tienda que falló. Para sumar
# una tienda nueva, agregar su código (ver app/stores.py) a matrix.store.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [carreno, primavera]
    name: sync (${{ matrix.store }})
    steps:
      - name: Trigger POST /api/accounts/sync-daily (${{ matrix.store }})
        env:
          SYNC_TOKEN: ${{ secrets.DAILY_SYNC_TOKEN }}
        run: |
          curl --fail --show-error \
            --retry 3 --retry-delay 30 --max-time 120 \
            -X POST "https://cierre-caja-api.onrender.com/api/accounts/sync-daily" \
            -H "X-Sync-Token: ${SYNC_TOKEN}" \
            -H "X-Store: ${{ matrix.store }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Si el paso de arriba falla incluso después de sus 3 reintentos (ej.
      # Render caído, backend en cold-start más de 120s, token vencido), este
      # paso solo corre por el "if: failure()" y avisa dentro del sistema -
      # así el problema queda visible para el admin en vez de perderse en un
      # log de GitHub Actions que nadie revisa a diario.
      - name: Reportar fallo de sincronización al sistema
        if: failure()
        env:
          SYNC_TOKEN: ${{ secrets.DAILY_SYNC_TOKEN }}
        run: |
          curl --show-error --max-time 30 \
            -X POST "https://cierre-caja-api.onrender.com/api/accounts/sync-failure" \
            -H "X-Sync-Token: ${SYNC_TOKEN}" \
            -H "X-Store: ${{ matrix.store }}" \
            -H "Content-Type: application/json" \
            -d '{"message": "El cron de sincronización diaria (9pm Colombia) falló después de 3 reintentos. Revisa Render y sincroniza manualmente desde Cuentas."}' \
            || echo "No se pudo reportar el fallo al sistema (revisar Render/DAILY_SYNC_TOKEN manualmente)"
